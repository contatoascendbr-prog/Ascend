services:
  - type: web
    name: ascend-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
  - key: CORS_ORIGINS
    sync: false
  - key: EMERGENT_LLM_KEY
    sync: false
